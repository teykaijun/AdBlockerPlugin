<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdBlocker</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body data-state="loading">
    <header class="topbar">
      <div class="brand">
        <img src="/icons/icon-32.png" width="20" height="20" alt="" />
        <span>AdBlocker</span>
      </div>
      <label class="switch" title="Blocking on all sites">
        <input type="checkbox" id="global-toggle" role="switch" aria-label="Blocking on all sites" />
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <main>
      <section class="site" aria-labelledby="site-host">
        <button id="site-toggle" class="power" type="button" aria-pressed="true" aria-describedby="site-status">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2v10" />
            <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
          </svg>
          <span class="visually-hidden" id="site-toggle-label">Block ads on this site</span>
        </button>
        <h1 class="site-host" id="site-host">&nbsp;</h1>
        <p class="site-status" id="site-status">&nbsp;</p>
      </section>

      <section class="stats" id="stats" aria-label="This page">
        <div class="stat">
          <span class="stat-value" id="blocked">0</span>
          <span class="stat-label">requests blocked</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="hidden">0</span>
          <span class="stat-label">elements hidden</span>
        </div>
      </section>

      <div class="notice" id="reload-bar" role="status" hidden>
        <span>Reload to apply changes.</span>
        <button class="btn btn-primary" id="reload" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          Reload
        </button>
      </div>
    </main>

    <footer>
      <div class="actions">
        <button class="btn" id="pick" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M22 12h-4M6 12H2M12 6V2M12 22v-4" />
          </svg>
          Hide an element
        </button>
        <button class="btn" id="open-options" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4" />
          </svg>
          Settings
        </button>
      </div>
      <p class="lifetime" id="lifetime"></p>
      <p class="error" id="error" role="alert" hidden></p>
    </footer>
  </body>
</html>
