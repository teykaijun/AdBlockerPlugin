name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    name: Chrome extension and filter lists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Includes a check that the generated rulesets and Android assets match filters/*.txt.
      - run: npm test

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a release on v* tags
    defaults:
      run:
        working-directory: android
    env:
      # Optional repository secrets for a stable release signature (see README).
      ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
      ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
      ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
      ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the release signing key
        if: env.ADBLOCKER_KEYSTORE_BASE64 != ''
        run: |
          echo "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ADBLOCKER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-android
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AdBlocker-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "AdBlocker-${GITHUB_REF_NAME}.apk" --generate-notes
