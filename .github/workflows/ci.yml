# Builds and tests both apps and the browser companion. Release files are built locally
# (see README) so the APK keeps one signature; the artifacts here are for checking changes.
name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going. Each tag
# build gets a group of its own, so it is never cancelled.
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AdBlocker.slnx

      - name: Publish adblocker.exe
        run: dotnet publish src/AdBlocker/AdBlocker.csproj -c Release -r win-x64 -o artifacts/publish

      - uses: actions/upload-artifact@v7
        with:
          name: AdBlocker-windows
          path: windows/artifacts/publish/adblocker.exe

  browser-extension:
    name: Browser companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        run: npm test

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      # Optional repository secrets (ADBLOCKER_KEYSTORE_*) sign the APK with a release key. Only the
      # steps that use them get them; a step's "if:" can't see secrets, so this says whether they're set.
      HAS_RELEASE_KEY: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default ("enhanced") caching is a proprietary part with its own terms of use;
          # basic caching is the MIT-licensed one.
          cache-provider: basic

      - name: Use the release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
        run: |
          echo "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ADBLOCKER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
          ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
          ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: AdBlocker-android
          path: android/app/build/outputs/apk/release/app-release.apk
