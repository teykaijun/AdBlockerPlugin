name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach the exe to a release on v* tags
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AdBlocker.slnx

      - name: Publish adblocker.exe
        run: dotnet publish src/AdBlocker/AdBlocker.csproj -c Release -r win-x64 -o artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-windows
          path: windows/artifacts/publish/adblocker.exe

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/publish/adblocker.exe --clobber

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to attach the APK to a release on v* tags
    defaults:
      run:
        working-directory: android
    env:
      # Optional repository secrets for a stable release signature (see README).
      ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
      ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
      ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
      ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the release signing key
        if: env.ADBLOCKER_KEYSTORE_BASE64 != ''
        run: |
          echo "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ADBLOCKER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-android
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "AdBlocker-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "AdBlocker-${GITHUB_REF_NAME}.apk" --clobber
