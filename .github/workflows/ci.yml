# Builds and tests both apps and the browser companion. Release files are built locally
# (see README) so the APK keeps one signature; the artifacts here are for checking changes.
name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AdBlocker.slnx

      - name: Publish adblocker.exe
        run: dotnet publish src/AdBlocker/AdBlocker.csproj -c Release -r win-x64 -o artifacts/publish

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-windows
          path: windows/artifacts/publish/adblocker.exe

  browser-extension:
    name: Browser companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Optional repository secrets (ADBLOCKER_KEYSTORE_*) to sign with a release key.
      ADBLOCKER_KEYSTORE_BASE64: ${{ secrets.ADBLOCKER_KEYSTORE_BASE64 }}
      ADBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.ADBLOCKER_KEYSTORE_PASSWORD }}
      ADBLOCKER_KEY_ALIAS: ${{ secrets.ADBLOCKER_KEY_ALIAS }}
      ADBLOCKER_KEY_PASSWORD: ${{ secrets.ADBLOCKER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Use the release signing key
        if: env.ADBLOCKER_KEYSTORE_BASE64 != ''
        run: |
          echo "$ADBLOCKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ADBLOCKER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AdBlocker-android
          path: android/app/build/outputs/apk/release/app-release.apk
